<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slip Gaji Guru</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f4f1ea;--fg:#222;--card:#fff;--line:#d8d2c4;--ac:#2f6b4f;--acfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d1b;--fg:#eee;--card:#2a2b28;--line:#4a4b46;--ac:#6fbf97;--acfg:#10221a}}
:root[data-theme="dark"]{--bg:#1c1d1b;--fg:#eee;--card:#2a2b28;--line:#4a4b46;--ac:#6fbf97;--acfg:#10221a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar label{display:flex;flex-direction:column;font-size:12px;gap:3px;opacity:.85}
.bar select,.bar button,.up{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-height:44px;box-sizing:border-box}
.bar button.p,.up{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600;cursor:pointer;display:inline-flex;align-items:center}
.bar button:disabled{opacity:.4}
.bar .sp{flex:1}
#st{font-size:13px;opacity:.85;padding:8px 14px}
#wrap{overflow:hidden;margin:6px 8px 24px}
#fit{transform-origin:0 0;width:1320px}
.sh{background:#fff;color:#111;font:14px Arial,Helvetica,sans-serif;padding:24px;width:1320px;box-sizing:border-box}
.row{display:flex;gap:16px;align-items:flex-start}
.sh table{border-collapse:collapse}
.sh td,.sh th{border:1px solid #333;padding:0 7px;height:27px;box-sizing:border-box}
.sh input{font:inherit;color:inherit;border:0;background:transparent;width:100%;height:26px;padding:0;margin:0;outline:0;text-align:right}
.sh input.l{text-align:left}.sh input.c{text-align:center}
.sh input:focus{background:#fff3a8}
.sh td.fl{background:#fff9d6}
.r{text-align:right}.ct{text-align:center}
#L{width:480px;table-layout:fixed}
.hd{display:flex;align-items:center;gap:14px;height:64px;padding:0 10px;font-weight:700;font-size:16px}
.logo{width:48px;height:48px;border:1px dashed #aaa;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#999;font-size:11px;cursor:pointer;background-size:contain;background-repeat:no-repeat;background-position:center;flex:none}
.logo.has{border:0}
.sec td{background:#eceae4;font-weight:700}
.it td:nth-child(2){padding-left:14px;font-size:13px;white-space:nowrap}
.g td,.rd td,.yl td{font-size:13px;white-space:nowrap}
.g td{background:#7dff4f;font-weight:700}.rd td{background:#ef4a38;color:#fff;font-weight:700}.yl td{background:#ffee33;font-weight:700}
#M{width:776px;table-layout:fixed}
#M th{background:#ed7d31;color:#fff;font-size:14px;font-weight:700;height:28px}
#M th.au{background:#6b6b6b}
#M tbody tr:nth-child(even) td:not(.fl){background:#f6f6f6}
#M td.au{font-size:12px;color:#444;line-height:1.2;white-space:normal}
.ex{margin:26px 4px 0;font-size:13px;line-height:1.7;color:#222}
.sg{display:flex;gap:340px;margin:44px 4px 30px}
@media (prefers-color-scheme:dark){.sh{color-scheme:light}}

.bar{padding:14px 16px;gap:14px}
.bar label{font-size:15px;font-weight:600;opacity:1}
.bar select,.bar button,.up{font-size:18px;min-height:54px;padding:12px 16px}
#st{font-size:17px;padding:12px 16px;line-height:1.5}
.logo{width:54px;height:54px;border:0;cursor:default}
.hd{height:70px}
#M td.au{font-size:13px;padding:3px 6px}
.bd{display:block;margin:2px 0;padding:3px 8px;border-radius:6px;font-weight:700;font-size:12px;line-height:1.25;text-align:center}
.bd.gr{background:#2e9e3f;color:#fff}.bd.ye{background:#ffd400;color:#222}.bd.re{background:#d92b2b;color:#fff}.bd.pu{background:#7b3fb8;color:#fff}
.ex{font-size:14px;line-height:1.6}.ex ul{margin:6px 0 10px;padding-left:22px}.ex li{margin:3px 0}
.sg{gap:0;justify-content:space-around;margin:36px 4px 30px}
.sb{width:320px;text-align:center;font-size:15px}
.sb .ln{height:90px}
.sb .nmx{border-top:1px solid #333;padding-top:5px;font-weight:700}
</style></head><body>
<div class="bar">
<label>Langkah 1<span class="up" id="upb" role="button" tabindex="0">Pilih file absensi</span></label>
<input type="file" id="f" accept=".txt,.TXT,text/plain" hidden>
<label>Langkah 2: Nama<select id="nm" disabled></select></label>
<label>Langkah 3: Bulan<select id="bl" disabled></select></label>
<span class="sp"></span>
<button class="p" id="dl" disabled>Download gambar</button>
</div>
<div id="st">Langkah 1: tekan tombol hijau "Pilih file absensi", lalu pilih file AGL_001.TXT.</div>
<input type="file" id="lf" accept="image/*" hidden>
<div id="wrap"><div id="fit"><div class="sh" id="sheet"></div></div></div>
<datalist id="d1"><option value="Fullday"></datalist>
<datalist id="d2"><option value="Brifing"></datalist>
<datalist id="d3"><option value="Terlambat"><option value="Tidak Absen Lengkap"><option value="Izin"><option value="Sakit"></datalist>
<script>
const GURU={nilam:{n:"Azmi Nilam Furi",t:"1 Mei 2025"},setia:{n:"Tri Setiani",t:"10 Juli 2023"},mei:{n:"Eka Mei Nurrahayu",t:"22 Januari 2024"},fatma:{n:"Fatmawati Kuswardani",t:"Oktober 2026"}};
const BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const SB=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const $=id=>document.getElementById(id);
let DATA={},VALS={},KEY="";
// [no,label,jumlah default,tipe] tipe: p=penerimaan, h=judul, k=potongan
const R=[[1,"GAPOK",12000,"p"],[2,"TUNJANGAN",0,"h"],["","Struktural",1500,"p"],["","Guru Kelas",2000,"p"],["","Masa Kerja",1000,"p"],["","S. Transp",10000,"p"],["","S. Makan",15000,"p"],["","Kesehatan",1000,"p"],["","THR","","p"],[3,"TAMBAHAN",0,"h"],["","Fullday",30000,"p"],["TP"],[4,"Potongan",0,"h"],["","",0,"k"],["","Terlambat Passcard datang",7000,"k"],["","Terlambat Passcard pulang",7000,"k"],["TK"],["TT"]];
const fm=n=>n===""||n==null||isNaN(n)?"":Number(n).toLocaleString("en-US");
const num=s=>{const x=parseFloat(String(s||"").replace(/,/g,"").replace(/[^\d.-]/g,""));return isNaN(x)?0:x};
const tm=m=>Math.floor(m/60)+":"+String(m%60).padStart(2,"0");
function parse(txt){
  const out={};
  txt.split(/\r?\n/).slice(1).forEach(l=>{
    const c=l.split("\t");if(c.length<7)return;
    const k=c[3].trim().toLowerCase();if(!GURU[k])return;
    const m=c[6].trim().match(/^(\d{4})\/(\d{2})\/(\d{2}) (\d{2}):(\d{2})/);if(!m)return;
    const ym=m[1]+"-"+m[2],d=+m[3],t=+m[4]*60+ +m[5];
    ((out[k]=out[k]||{})[ym]=out[k][ym]||{})[d]=(out[k][ym][d]||[]).concat(t);
  });
  return out;
}
function load(txt){
  DATA=parse(txt);
  const ks=Object.keys(GURU).filter(k=>DATA[k]);
  if(!ks.length){$("st").textContent="Tidak ada data guru yang cocok di file ini.";return false}
  $("nm").innerHTML=ks.map(k=>`<option value="${k}">${GURU[k].n}</option>`).join("");
  $("nm").disabled=false;fillBln();
  $("st").textContent="Data sudah terbaca. Pilih Nama dan Bulan, isi kotak kuning muda di slip, lalu tekan tombol Download gambar.";
  return true;
}
function fillBln(){
  const ms=Object.keys(DATA[$("nm").value]||{}).sort().reverse();
  $("bl").innerHTML=ms.map(m=>{const[y,mo]=m.split("-");return `<option value="${m}">${BLN[+mo-1]} ${y}</option>`}).join("");
  $("bl").disabled=false;render();
}
function status(a,b){
  const r=[];
  if(a===b)r.push(["Tidak Absen Lengkap","pu"]);
  else{
    if(b>=1020)r.push(["Fullday","gr"]);else if(b>=959&&b<=1019)r.push(["Fullday/Absen Pulang Kelebihan","ye"]);
    if(a>=425&&a<=600)r.push(["Terlambat","re"]);
  }
  return r.map(x=>`<span class="bd ${x[1]}">${x[0]}</span>`).join("");
}
function render(){
  const nk=$("nm").value,ym=$("bl").value;if(!nk||!ym)return;
  KEY=nk+"|"+ym;const V=VALS[KEY]=VALS[KEY]||{};
  const[y,mo]=ym.split("-"),days=DATA[nk][ym];
  const ds=Object.keys(days).map(Number).sort((a,b)=>a-b);
  let L=`<table id="L"><colgroup><col width="34"><col><col width="50"><col width="92"><col width="100"></colgroup>
<tr><td colspan="5" style="padding:0"><div class="hd"><div class="logo" id="lg">Logo</div><span>SLIP GAJI PAUD TERPADU HEBAT (KB -TPA)</span></div></td></tr>
<tr><td colspan="2"><b>Nama</b> &nbsp;${GURU[nk].n}</td><td colspan="3"><b>TMT</b> &nbsp;${GURU[nk].t}</td></tr>
<tr><td colspan="5"><b>Bulan</b> &nbsp;${BLN[+mo-1]} ${y}</td></tr>
<tr style="background:#333;color:#fff;font-weight:700"><td class="ct">No</td><td>Rincian</td><td class="ct">Vol</td><td class="r">Jumlah</td><td class="r">Total</td></tr>`;
  R.forEach((r,i)=>{
    const t=r[0];
    if(t==="TP")L+=`<tr class="g"><td></td><td>Total penerimaan</td><td></td><td class="r" id="sj"></td><td class="r" id="st1"></td></tr>`;
    else if(t==="TK")L+=`<tr class="rd"><td></td><td>Total Potongan</td><td></td><td></td><td class="r" id="tk"></td></tr>`;
    else if(t==="TT")L+=`<tr class="yl"><td></td><td>Total terima dalam 1 bulan</td><td></td><td></td><td class="r" id="tt"></td></tr>`;
    else if(r[3]==="h")L+=`<tr class="sec"><td class="ct">${t}</td><td>${r[1]}</td><td></td><td></td><td></td></tr>`;
    else{
      const lab=r[1]===""?`<input class="l" data-k="l${i}" placeholder="potongan lain (isi sendiri)" value="${V["l"+i]||""}">`:r[1];
      const jv=V["j"+i]!==undefined?V["j"+i]:(r[2]===0?"":fm(r[2]));
      L+=`<tr class="it"><td></td><td${r[1]===""?' class="fl"':""}>${lab}</td><td class="fl"><input data-k="v${i}" inputmode="decimal" class="c" value="${V["v"+i]||""}"></td><td class="fl"><input data-k="j${i}" data-n="1" inputmode="numeric" value="${jv}"></td><td class="r" id="t${i}"></td></tr>`;
    }
  });
  L+="</table>";
  let M=`<table id="M"><colgroup><col width="42"><col width="100"><col width="58"><col width="58"><col width="84"><col width="84"><col width="118"><col></colgroup>
<thead><tr><th rowspan="2">No</th><th rowspan="2">Tanggal</th><th rowspan="2">Awal</th><th rowspan="2">Akhir</th><th colspan="3">Status Validasi Absensi</th><th rowspan="2" class="au">Validasi</th></tr>
<tr><th>Fullday</th><th>Brifing</th><th>ket</th></tr></thead><tbody>`;
  ds.forEach((d,i)=>{
    const ts=days[d],a=Math.min(...ts),b=Math.max(...ts);
    const c=(n,l)=>`<td class="fl"><input class="c" data-k="m${d}_${n}" value="${V["m"+d+"_"+n]||""}"></td>`;
    M+=`<tr><td class="ct">${i+1}</td><td class="r">${d} ${SB[+mo-1]} ${y}</td><td class="r">${tm(a)}</td><td class="r">${tm(b)}</td>${c(1,"d1")}${c(2,"d2")}${c(3,"d3")}<td class="au">${status(a,b)}</td></tr>`;
  });
  M+="</tbody></table>";
  $("sheet").innerHTML=`<div class="row">${L}${M}</div>
<div class="ex"><div><b>Penjelasan :</b></div>
<ul>
<li>Masuk normal (tanpa Fullday) hanya mendapatkan hak poin 1 dan 2.</li>
<li>Terlambat datang setelah pukul 07.00 dikenakan potongan Rp7.000.</li>
<li>Pulang sebelum pukul 17.00 dikenakan potongan Rp7.000. Kekurangan jam pulang juga diperhitungkan.</li>
<li>Pulang pukul 17.00 dihitung sebagai 1 hari kerja penuh.</li>
<li>Perhitungan menggunakan rata-rata 20 hari kerja per bulan. Jumlah hari kerja dapat berbeda setiap bulan (sekitar 12–24 hari), tetapi libur semester tetap diperhitungkan dan dibayar.</li>
<li>Keterlambatan, ketidakhadiran, dan pulang lebih awal akan mengurangi pembayaran sesuai ketentuan yang berlaku.</li>
</ul>
<div><i>**Kenapa kalau terlambat/absen di potong? Karena kerja di bayar, kalau tidak kerja ya tidak dibayar.</i></div></div>
<div class="sg"><div class="sb"><div>Pengelola</div><div class="ln"></div><div class="nmx">Desnaini</div></div><div class="sb"><div>Pendidik</div><div class="ln"></div><div class="nmx">${GURU[nk].n}</div></div></div>`;
  $("sheet").querySelectorAll("input[data-k]").forEach(el=>el.addEventListener("input",()=>{
    if(el.dataset.n)fmtI(el);else if(el.dataset.k[0]==="v")el.value=el.value.replace(/[^\d.]/g,"");
    V[el.dataset.k]=el.value;calc();
  }));
  logo();calc();fit();$("dl").disabled=false;
}
function fmtI(el){
  const pos=el.selectionStart==null?el.value.length:el.selectionStart;
  const before=el.value.slice(0,pos).replace(/\D/g,"").length,d=el.value.replace(/\D/g,"");
  el.value=d?Number(d).toLocaleString("en-US"):"";
  let c=0,p=0;for(;p<el.value.length&&c<before;p++)if(/\d/.test(el.value[p]))c++;
  try{el.setSelectionRange(p,p)}catch(e){}
}
function calc(){
  let sj=0,sp=0,sk=0;
  R.forEach((r,i)=>{
    if(r[3]!=="p"&&r[3]!=="k")return;
    const el=$("sheet").querySelector(`[data-k=j${i}]`),vv=$("sheet").querySelector(`[data-k=v${i}]`);
    const j=num(el.value),v=num(vv.value),has=vv.value.trim()!=="";
    const tot=has?v*j:0;
    $("t"+i).textContent=r[3]==="k"?fm(tot):(has?fm(tot):"");
    if(r[3]==="p"){sj+=j;sp+=tot}else sk+=tot;
  });
  $("sj").textContent=fm(sj);$("st1").textContent=fm(sp);$("tk").textContent=fm(sk);$("tt").textContent=fm(sp-sk);

function logo(){
  const el=$("lg");if(!el)return;
  el.classList.add("has");el.textContent="";el.style.backgroundImage=`url(${LOGO})`;
}
$("lf").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{localStorage.setItem("logo",r.result)}catch(x){}
    const el=$("lg");if(el){el.classList.add("has");el.textContent="";el.style.backgroundImage=`url(${r.result})`}};
  r.readAsDataURL(f);
};
function fit(){
  const w=$("wrap").clientWidth,s=Math.min(1,w/1320);
  $("fit").style.transform=`scale(${s})`;$("wrap").style.height=($("sheet").offsetHeight*s)+"px";
}
addEventListener("resize",fit);
$("upb").onclick=()=>$("f").click();
$("f").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{if(load(r.result)){try{localStorage.setItem("fp",r.result)}catch(x){}}};
  r.readAsText(f);
};
$("nm").onchange=fillBln;$("bl").onchange=render;
$("dl").onclick=async()=>{
  const nama=GURU[$("nm").value].n,bln=$("bl").selectedOptions[0].textContent;
  $("dl").disabled=true;$("st").textContent="Membuat gambar…";
  try{
    const cv=await html2canvas($("sheet"),{scale:2,backgroundColor:"#fff",windowWidth:1320,
      onclone:d=>{d.getElementById("fit").style.transform="none";
        d.querySelectorAll(".fl").forEach(e=>e.classList.remove("fl"));
        d.querySelectorAll("input[placeholder]").forEach(e=>e.removeAttribute("placeholder"));
        const g=d.getElementById("lg");if(g&&!g.classList.contains("has"))g.style.visibility="hidden"}});
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    let dls=null;try{if(typeof claude!=="undefined")dls=await claude.use("downloads")}catch(x){}
    const fn=`Slip Gaji ${nama} ${bln}.png`;
    if(dls){await dls.save({filename:fn,data:blob});$("st").textContent="Selesai."}
    else{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);$("st").textContent="Selesai. Gambar tersimpan di folder Download."}
  }catch(e){$("st").textContent="Gambar tidak jadi disimpan."}
  $("dl").disabled=false;
};
try{const s=localStorage.getItem("fp");if(s)load(s)}catch(e){}
</script></body></html>
